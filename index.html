<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 5 - Testimonios</title>
<!-- MÉTODO 1: CDN (requiere internet) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
  <h2 class="h3 fw-bold text-center mb-4">Lo que dicen nuestros estudiantes</h2>
  <div class="row g-4">
    <div class="col-12 col-md-6">
      <figure class="p-4 bg-white border-start border-4 border-primary rounded shadow-sm h-100 mb-0">
        <blockquote class="blockquote">
          <p class="fs-5 fw-medium mb-3">"Gracias a la metodología Mobile First pude lanzar mi primera tienda en línea en una semana."</p>
        </blockquote>
        <figcaption class="blockquote-footer mb-0">
          Mariana Silva en <cite title="Tech Startups">Tech Startups</cite>
        </figcaption>
      </figure>
    </div>
    <div class="col-12 col-md-6">
      <figure class="p-4 bg-white border-start border-4 border-success rounded shadow-sm h-100 mb-0">
        <blockquote class="blockquote">
          <p class="fs-5 fw-medium mb-3">"Aprender a usar los 3 métodos de conexión me dio la confianza para trabajar en cualquier proyecto."</p>
        </blockquote>
        <figcaption class="blockquote-footer mb-0">
          David López en <cite title="DevStudio">DevStudio</cite>
        </figcaption>
      </figure>
    </div>
  </div>
</div>
<!-- JavaScript desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
